[build-system]
requires = ["setuptools>=46.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flattool"
version = "2026.10.26.5"
description="FlatTool - A Textual-based TUI for searching, installing, listing, launching, and uninstalling Flatpak apps."
authors = [{ name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["flatpak", "linux", "installation", "utility", "utilities", "software"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]
dependencies = [
    "rich>=13.9.4",
    "textual>=1.0.0",
    "cyclopts>=3.0.0"
]

[project.urls]
"Bug Tracker" = "https://github.com/travisseymour/flattool/issues"
"Documentation" = "https://github.com/travisseymour/flattool#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.1",
    "ruff>=0.1",
    "build>=0.10",
    "check-manifest>=0.48",
]

[project.scripts]
flattool = "flattool.__main__:main"
ft = "flattool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flattool"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
flattool = ["py.typed"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.ignore = ["F821", "F841", "E722", "BLE001"]  # undefined name, assigned but unused variable, bare except, blind exception
